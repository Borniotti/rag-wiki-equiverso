[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-equiverso"
version = "0.1.0"
description = "Assistente de perguntas sobre a Wiki do Equiverso, com busca BM25, Claude e filtro de spoiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-equiverso = "rag_equiverso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
